# Pages se queda en "errored" y entonces ningun despliegue nuevo entra. Desde un
# workflow si se alcanza la API de Pages (el token trae pages=write), asi que desde
# aqui se consulta el estado y se pide una construccion limpia.
name: Destrabar Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  destrabar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir una construccion limpia
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          echo "=== antes"
          gh api "repos/$R/pages" --jq '{status,build_type}'
          echo "=== pidiendo construccion"
          gh api -X POST "repos/$R/pages/builds" || echo "(no se pudo pedir)"
          for i in $(seq 1 40); do
            sleep 15
            E=$(gh api "repos/$R/pages/builds/latest" --jq '"\(.status) \(.error.message // "")"')
            echo "  intento $i: $E"
            case "$E" in built*) echo "=== LISTO"; break;; errored*) echo "=== FALLO"; break;; esac
          done
          echo "=== despues"
          gh api "repos/$R/pages" --jq '{status,build_type,html_url}'
