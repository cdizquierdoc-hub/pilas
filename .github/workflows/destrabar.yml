# Comprueba que lo que el sitio sirve de verdad sea la version que esta en main.
# El runner si alcanza github.io; esta sesion no.
name: Destrabar Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  destrabar:
    runs-on: ubuntu-latest
    steps:
      - name: Estado y verificacion
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh api "repos/$R/pages" --jq '"sitio: \(.status) · \(.html_url)"'
          gh api "repos/$R/pages/builds/latest" --jq '"ultima construccion: \(.status) · commit \(.commit[0:7]) · \(.created_at)"'
          U=$(gh api "repos/$R/pages" --jq .html_url)
          echo "=== bajando $U"
          curl -sS -o pagina.html -w "HTTP %{http_code} · %{size_download} bytes\n" "$U"
          echo "=== que trae"
          grep -o "const VERSION_APP = '[^']*'" pagina.html || echo "  SIN sello de version (es una copia vieja)"
          grep -c "TVWALL2" pagina.html | sed 's/^/  TVWALL2 aparece /' || true
          grep -o "versión <b>v[0-9]*</b>" pagina.html | head -1 || echo "  SIN marca de version del marcador"
          echo "=== fotos.zip"
          curl -sS -o /dev/null -w "  HTTP %{http_code} · %{size_download} bytes\n" "${U}fotos.zip"
