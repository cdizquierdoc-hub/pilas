# Un despliegue de Pages quedo colgado en "en progreso" y bloquea a los siguientes.
# Desde aqui si se puede consultar y cancelar: el token del workflow tiene permiso
# sobre Pages, que es justo lo que no se alcanza desde fuera.
name: Destrabar Pages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit del despliegue atascado
        required: true

permissions:
  pages: write
  id-token: write

jobs:
  destrabar:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar, cancelar y volver a mirar
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          S: ${{ inputs.sha }}
        run: |
          echo "=== estado del despliegue atascado"
          gh api "repos/$R/pages/deployments/$S" || echo "(no se pudo consultar)"
          echo "=== ultimo despliegue del sitio"
          gh api "repos/$R/pages" --jq '{status,html_url,build_type,source}' || echo "(no se pudo)"
          echo "=== cancelando"
          gh api -X POST "repos/$R/pages/deployments/$S/cancel" -i || echo "(fallo el cancel)"
          sleep 10
          echo "=== estado despues de cancelar"
          gh api "repos/$R/pages/deployments/$S" || echo "(no se pudo consultar)"
